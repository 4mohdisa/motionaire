[workspace]
members = ["."]

[package]
name = "motionaire"
version = "0.1.0"
default-run = "motionaire"
description = "AI-native editor for screen recordings and talking-head content"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "motionaire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
wgpu = "24.0.5"
pollster = "1.0.1"
bytemuck = { version = "1.25.1", features = ["derive"] }
png = "0.18.1"
tokio = { version = "1.52.3", features = ["sync", "rt", "net", "time", "macros"] }
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
bytes = "1.12.1"
env_logger = "0.11.11"
